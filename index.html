<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Res Arcana Place of Power Randomizer</title>
  <style>
    body { max-width: 42rem; margin: 0 auto; padding: 1rem; font-family: system-ui, sans-serif; line-height: 1.4; }
    h1 { font-size: 1.5rem; }
    #weights { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem 5.5rem; gap: .5rem 1rem; align-items: center; }
    .column-heading { font-weight: 600; }
    input, button { box-sizing: border-box; min-height: 2.75rem; font: inherit; }
    input { width: 100%; padding: .5rem; }
    .ticket-count { padding: .5rem; text-align: center; font-variant-numeric: tabular-nums; }
    button { width: 100%; padding: .6rem 1rem; cursor: pointer; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin-top: 1.25rem; }
    #output { min-height: 3rem; }
    #output[role="alert"] { color: #a40000; }
    @media (max-width: 30rem) {
      #weights { grid-template-columns: minmax(0, 1fr) 4.75rem 4.75rem; gap: .5rem; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Res Arcana Place of Power Randomizer</h1>
    <p>Each place starts at its maximum. Selected places lose half their tickets; every other place gains one, up to its maximum.</p>
    <form id="randomizer">
      <div id="weights">
        <span class="column-heading">Place</span>
        <span class="column-heading">Maximum</span>
        <span class="column-heading">Current</span>
      </div>
      <div class="actions">
        <button type="submit">Generate set</button>
        <button id="reset-tickets" type="button">Reset tickets to max</button>
      </div>
    </form>
    <h2>Selected places</h2>
    <div id="output" aria-live="polite">Press &ldquo;Generate set&rdquo; to begin.</div>
  </main>
  <script src="selector.js"></script>
</body>
</html>
